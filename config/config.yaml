# Configuration générale du projet (paramètres non sensibles)
# Les secrets (clés API, URI MongoDB) vont dans .env, PAS ici

project:
  name: "World Cup Intelligence & Prediction Platform"
  target_edition: 2026

mongodb:
  collections:
    teams: "teams"
    matches: "matches"
    editions: "editions"
    standings: "standings"
    predictions: "predictions"

data_sources:
  historical:
    name: "Kaggle World Cup Database"
    url: "https://www.kaggle.com/datasets/joshfjelstul/world-cup-database"
    years: [1930, 2018]
  world_cup_2022:
    name: "API-Football"
    url: "https://www.api-football.com"
  world_cup_2026:
    name: "native-stats.org"
    url: "https://native-stats.org/competition/WC/"

model:
  type: "xgboost"
  test_split: 0.2
  random_state: 42
  validation_edition: 2022

simulation:
  target_edition: 2026
  n_simulations: 10000
